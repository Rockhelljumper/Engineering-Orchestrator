# Runs the test suites only. No secrets, no deployment, no write permissions.
# Third-party actions are pinned by full commit SHA (tag in the comment).
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - run: node --version
      - name: Unit tests
        run: node --test "tests/unit/**/*.test.ts"
      - name: Integration tests
        run: node --test --test-concurrency=1 "tests/integration/**/*.test.ts"
      - name: Behavioural tests (crash recovery)
        run: node --test --test-concurrency=1 "tests/behavioral/**/*.test.ts"
